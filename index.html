<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>۶﹒𝑇𝑂𝑁𝐸 ² ﹒</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts: Prompt & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Plus Jakarta Sans', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style>
    /* Dark to White Gradient Background (Dominant Dark at Top) */
    body {
      background: linear-gradient(180deg, #000000 0%, #050505 45%, #111113 70%, #28282d 88%, #ffffff 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: #e5e7eb;
      font-family: 'Prompt', sans-serif;
      overflow-x: hidden;
    }

    /* Sparse Twinkling Stars Background Effect */
    .star {
      position: absolute;
      background-color: #ffffff;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle 4s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.6); }
      50% { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 6px rgba(255, 255, 255, 0.8); }
    }

    /* Main Container Glassmorphism */
    .glass-card {
      background: rgba(15, 15, 18, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    /* iOS Smooth Liquid Glass Button Styling */
    .ios-glass-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Shimmer Wave Effect on Hover / Touch */
    .ios-glass-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
      transition: transform 0.8s ease;
    }

    .ios-glass-btn:hover::before, .ios-glass-btn:active::before {
      transform: translateX(200%);
    }

    .ios-glass-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35), 0 0 15px rgba(255, 255, 255, 0.05);
    }

    .ios-glass-btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* Disc Rotation Animation */
    @keyframes spin-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 8s linear infinite;
    }

    /* Hide Scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-3 sm:p-6 min-h-screen relative">

  </div>

  <!-- Main Glass Container Card -->

    <!-- Profile & Shop Info -->

      <!-- Profile Picture -->
      <div class="relative group">
        <div class="w-24 h-24 rounded-full p-1 bg-gradient-to-b from-white/30 to-white/5 backdrop-blur-md shadow-2xl">
          <img src="https://cdn.phototourl.com/member/2026-09-29-a17a32bd-6130-4b67-afad-2e2221d7cf0c.jpg" 
               onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80'"

               class="w-full h-full object-cover rounded-full border border-white/20 shadow-inner">

        <span class="absolute bottom-1 right-1 w-4 h-4 bg-emerald-500 border-2 border-black rounded-full" title="Online"></span>
      </div>

      <!-- Shop Title -->
      <h1 class="mt-3 text-xl font-medium tracking-wide text-white drop-shadow-md">
        ‎۶﹒𝑇𝑂𝑁𝐸 ²   ݁݁﹒ 󠁛
      </h1>
      <p class="text-[11px] text-neutral-400 mt-1 font-light tracking-widest lowercase">living my life in my style.</p>

    <!-- VIEW 1: MAIN NAVIGATION PAGE -->
    <div id="mainView" class="px-6 pb-6 flex-1 flex flex-col justify-between transition-all duration-300">
      <div class="space-y-3.5 mt-2">
        
        <!-- Link 1: Facebook -->
        <a href="https://www.facebook.com/share/1C4zz3iJKC/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" 
           class="ios-glass-btn w-full py-4 px-5 flex items-center justify-between group">

        <!-- Link 2: Discord -->
        <a href="https://discord.gg/RGDHb6kTaN" target="_blank" rel="noopener noreferrer"

          <div class="flex items-center space-x-4">

        <!-- Link 3: Credit -->

      <!-- Footer Note -->

    <!-- VIEW 2: CREDIT / REVIEW ZONE PAGE -->
    <div id="reviewView" class="hidden px-5 pb-6 flex-1 flex flex-col transition-all duration-300">
      
      <!-- Back Navigation Bar -->
      <div class="flex items-center justify-between py-2 mb-3 border-b border-white/10">

        </button>
        <span class="text-[11px] text-neutral-400 font-light tracking-wider">Feedback Center</span>
      </div>

      <!-- Section Title -->
      <div class="text-center mb-3">
        <h2 class="text-lg font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-neutral-100 via-neutral-300 to-neutral-400 tracking-wider">
          Review Zone
        </h2>
        <p class="text-[11px] text-neutral-400 font-light mt-0.5">แบ่งปันความรู้สึกและรีวิวบริการได้ที่นี่</p>
      </div>

      <!-- Reviews Feed List -->
      <div id="reviewsList" class="flex-1 max-h-[210px] overflow-y-auto space-y-2.5 pr-1 no-scrollbar mb-3">
        <!-- Default Empty State -->
        <div id="emptyReviewState" class="flex flex-col items-center justify-center py-8 text-center bg-black/20 rounded-2xl border border-dashed border-white/10">
          <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-neutral-400 mb-2">

          </div>
          <p class="text-xs font-medium text-neutral-300">No Review Yet</p>
          <p class="text-[11px] text-neutral-500 font-light mt-0.5">Let's be the first!</p>
        </div>
      </div>

      <!-- Add Review Input Box -->
      <div class="bg-black/40 border border-white/15 rounded-2xl p-3 backdrop-blur-md">
        
        <!-- Identity Selection -->
        <div class="mb-2.5 flex items-center justify-between gap-2">
          <span class="text-[11px] text-neutral-400">ระบุชื่อ:</span>

                   placeholder="นามฟงนามแฝงก็ได้แม่"

        <!-- Main Text Input -->
        <div class="relative">

          <!-- Emoji & Image Attachment Buttons -->
          <div class="absolute right-2 bottom-2.5 flex items-center gap-2">
            <button onclick="toggleEmojiPicker()" title="ใส่อีโมจิ" class="text-neutral-400 hover:text-white text-xs transition-colors p-1">
              <i class="fa-regular fa-face-smile"></i>
            </button>
            <label title="แนบรูปภาพ" class="text-neutral-400 hover:text-white text-xs cursor-pointer transition-colors p-1">
              <i class="fa-regular fa-image"></i>
              <input type="file" id="imageAttachmentInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
            </label>
          </div>
        </div>

        <!-- Attached Image Preview Container -->
        <div id="imagePreviewContainer" class="hidden mt-2 relative w-16 h-16 rounded-lg overflow-hidden border border-white/20">
          <img id="imagePreview" src="" class="w-full h-full object-cover" alt="Preview">
          <button onclick="removeAttachedImage()" class="absolute top-0.5 right-0.5 bg-black/80 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px]">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Emoji Picker Box -->
        <div id="emojiPicker" class="hidden my-2 p-2 bg-neutral-900/90 border border-white/20 rounded-xl grid grid-cols-6 gap-1 text-center text-sm backdrop-blur-md">

          <span class="cursor-pointer hover:bg-white/10 p-1 rounded" onclick="addEmoji('💖')">💖</span>
          <span class="cursor-pointer hover:bg-white/10 p-1 rounded" onclick="addEmoji('🌸')">🌸</span>
          <span class="cursor-pointer hover:bg-white/10 p-1 rounded" onclick="addEmoji('⭐')">⭐</span>
          <span class="cursor-pointer hover:bg-white/10 p-1 rounded" onclick="addEmoji('👍')">👍</span>
          <span class="cursor-pointer hover:bg-white/10 p-1 rounded" onclick="addEmoji('🥰')">🥰</span>
        </div>

        <!-- Post Review Button -->
        <button onclick="postReview()" 
                class="w-full mt-2 py-2 bg-gradient-to-r from-neutral-200 to-neutral-400 hover:from-white hover:to-neutral-200 text-black font-medium text-xs rounded-xl shadow-md transition-all flex items-center justify-center gap-1.5 active:scale-98">

          <span>ส่งรีวิว ✨</span>

    <!-- Bottom Tab Navigation Bar -->
    <div class="mt-auto border-t border-white/10 bg-black/50 backdrop-blur-xl flex items-center justify-around py-3">
      <button id="tabMainBtn" onclick="switchTab('main')" class="flex flex-col items-center text-white font-medium transition-colors">
        <i class="fa-solid fa-house text-xs mb-1"></i>
        <span class="text-[10px]">Main</span>
      </button>
      <div class="h-4 w-[1px] bg-white/10"></div>
      <button id="tabReviewBtn" onclick="switchTab('review')" class="flex flex-col items-center text-neutral-500 hover:text-white font-medium transition-colors">
        <i class="fa-solid fa-comments text-xs mb-1"></i>
        <span class="text-[10px]">Credit</span>
      </button>
    </div>

  </div>

  <!-- Inline Edit Modal Box -->
  <div id="editModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-neutral-900 border border-white/20 rounded-2xl p-4 w-full max-w-xs shadow-2xl">
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-medium text-white flex items-center gap-1.5">
          <i class="fa-solid fa-pen-to-square text-neutral-400"></i>
          แก้ไขรีวิวของคุณ
        </span>
        <button onclick="closeEditModal()" class="text-neutral-400 hover:text-white text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <textarea id="editModalTextarea" rows="3" class="w-full bg-white/5 border border-white/15 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-white/40 font-light resize-none mb-3"></textarea>
      <div class="flex items-center justify-end gap-2">
        <button onclick="closeEditModal()" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-neutral-300">ยกเลิก</button>
        <button onclick="saveEditedReview()" class="px-3 py-1.5 rounded-lg bg-white text-black font-medium text-xs hover:bg-neutral-200">บันทึก</button>
      </div>
    </div>
  </div>

  <script>
    let isPlaying = true;
    let currentIdentity = 'anonymous';
    let attachedImageData = null;
    let currentEditingReviewElement = null;

    // Generate Sparse Twinkling Stars in Background
    function createTwinklingStars() {
      const container = document.getElementById('starsContainer');
      const starCount = 35;

      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        
        const size = Math.random() * 2 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        
        star.style.top = `${Math.random() * 100}%`;
        star.style.left = `${Math.random() * 100}%`;
        
        star.style.animationDelay = `${Math.random() * 5}s`;
        star.style.animationDuration = `${3 + Math.random() * 4}s`;
        
        container.appendChild(star);
      }
    }

    // Toggle Audio Playback
    function toggleAudio() {
      const iframe = document.getElementById('ytPlayer');
      const discIcon = document.getElementById('discIcon');
      const musicNoteIcon = document.getElementById('musicNoteIcon');

      if (isPlaying) {
        iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        discIcon.classList.remove('animate-spin-slow');
        musicNoteIcon.className = "fa-solid fa-volume-xmark text-neutral-400";
        isPlaying = false;
      } else {
        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        discIcon.classList.add('animate-spin-slow');
        musicNoteIcon.className = "fa-solid fa-music text-white/90";
        isPlaying = true;
      }
    }

    // Attempt Autoplay on First Interaction
    window.addEventListener('click', function initAudioOnInteraction() {
      const iframe = document.getElementById('ytPlayer');
      if (iframe && isPlaying) {
        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
      }
    }, { once: true });

    // Switch View Tabs
    function switchTab(tab) {
      const mainView = document.getElementById('mainView');
      const reviewView = document.getElementById('reviewView');
      const tabMainBtn = document.getElementById('tabMainBtn');
      const tabReviewBtn = document.getElementById('tabReviewBtn');

      if (tab === 'main') {
        mainView.classList.remove('hidden');
        reviewView.classList.add('hidden');
        tabMainBtn.className = "flex flex-col items-center text-white font-medium transition-colors";
        tabReviewBtn.className = "flex flex-col items-center text-neutral-500 hover:text-white font-medium transition-colors";
      } else {
        mainView.classList.add('hidden');
        reviewView.classList.remove('hidden');
        tabMainBtn.className = "flex flex-col items-center text-neutral-500 hover:text-white font-medium transition-colors";
        tabReviewBtn.className = "flex flex-col items-center text-white font-medium transition-colors";
      }
    }

    // Identity Selector (Anonymous / Custom)
    function setIdentity(type) {
      const anonBtn = document.getElementById('anonBtn');
      const customInput = document.getElementById('customNameInput');

      if (type === 'anonymous') {
        currentIdentity = 'anonymous';
        anonBtn.className = "px-2.5 py-1 text-[11px] rounded-lg bg-white/20 text-white border border-white/40 shadow-sm";
        customInput.value = '';
      } else {
        currentIdentity = 'custom';
        anonBtn.className = "px-2.5 py-1 text-[11px] rounded-lg bg-white/5 text-neutral-400 border border-white/10";
      }
    }

    // Emoji Picker Logic
    function toggleEmojiPicker() {
      document.getElementById('emojiPicker').classList.toggle('hidden');
    }

    function addEmoji(emoji) {
      const textarea = document.getElementById('reviewTextInput');
      textarea.value += emoji;
      toggleEmojiPicker();
      textarea.focus();
    }

    // Handle Attached Image File Selection
    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          attachedImageData = e.target.result;
          document.getElementById('imagePreview').src = attachedImageData;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function removeAttachedImage() {
      attachedImageData = null;
      document.getElementById('imageAttachmentInput').value = '';
      document.getElementById('imagePreviewContainer').classList.add('hidden');
    }

    // Post Review Function
    function postReview() {
      const textInput = document.getElementById('reviewTextInput');
      const customNameInput = document.getElementById('customNameInput');
      const reviewText = textInput.value.trim();

      if (!reviewText && !attachedImageData) return;

      let authorName = "Anonymous";
      if (currentIdentity === 'custom' && customNameInput.value.trim() !== '') {
        authorName = customNameInput.value.trim();
      }

      const emptyState = document.getElementById('emptyReviewState');
      if (emptyState) emptyState.remove();

      const reviewsList = document.getElementById('reviewsList');
      const newReview = document.createElement('div');
      newReview.className = "review-item bg-white/5 border border-white/10 rounded-xl p-3 backdrop-blur-sm transition-all duration-300 relative group";

      let imageHtml = '';
      if (attachedImageData) {
        imageHtml = `<img src="${attachedImageData}" class="mt-2 max-h-28 rounded-lg object-cover border border-white/10">`;
      }

      newReview.innerHTML = `
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-medium text-amber-200/90 flex items-center gap-1.5">
            <i class="fa-regular fa-user text-[10px] text-neutral-400"></i>
            ${escapeHtml(authorName)}
          </span>
          <div class="flex items-center gap-2">
            <button onclick="openEditModal(this)" title="แก้ไข" class="text-[10px] text-neutral-400 hover:text-white transition-colors">
              <i class="fa-regular fa-pen-to-square"></i>
            </button>
            <button onclick="deleteReview(this)" title="ลบ" class="text-[10px] text-neutral-400 hover:text-red-400 transition-colors">
              <i class="fa-regular fa-trash-can"></i>
            </button>
            <span class="text-[9px] text-neutral-500 ml-1">เมื่อกี้</span>
          </div>
        </div>
        <p class="review-text text-xs text-neutral-200 font-light leading-relaxed">${escapeHtml(reviewText)}</p>
        ${imageHtml}
      `;

      reviewsList.insertBefore(newReview, reviewsList.firstChild);

      textInput.value = '';
      removeAttachedImage();
    }

    // Delete Review Function
    function deleteReview(btn) {
      const reviewCard = btn.closest('.review-item');
      if (reviewCard) {
        reviewCard.style.opacity = '0';
        reviewCard.style.transform = 'scale(0.95)';
        setTimeout(() => {
          reviewCard.remove();
          const reviewsList = document.getElementById('reviewsList');
          if (reviewsList.children.length === 0) {
            reviewsList.innerHTML = `
              <div id="emptyReviewState" class="flex flex-col items-center justify-center py-8 text-center bg-black/20 rounded-2xl border border-dashed border-white/10">
                <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-neutral-400 mb-2">
                  <i class="fa-regular fa-comment-dots text-lg"></i>
                </div>
                <p class="text-xs font-medium text-neutral-300">No Review Yet</p>
                <p class="text-[11px] text-neutral-500 font-light mt-0.5">Let's be the first!</p>
              </div>
            `;
          }
        }, 200);
      }
    }

    // Edit Review Modal Logic
    function openEditModal(btn) {
      const reviewCard = btn.closest('.review-item');
      const textElem = reviewCard.querySelector('.review-text');
      currentEditingReviewElement = textElem;
      
      document.getElementById('editModalTextarea').value = textElem.innerText;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
      currentEditingReviewElement = null;
    }

    function saveEditedReview() {
      if (currentEditingReviewElement) {
        const newText = document.getElementById('editModalTextarea').value.trim();
        if (newText) {
          currentEditingReviewElement.innerText = newText;
        }
      }
      closeEditModal();
    }

    // Escape HTML Helper
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    window.onload = function() {
  createTwinklingStars();
}

    }
  </script>
</body>
